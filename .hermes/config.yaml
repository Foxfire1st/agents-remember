# Merge these settings into ~/.hermes/config.yaml.
#
# Replace <PATH/TO/YOUR/PROJECTS_FOLDER> before starting Hermes.

mcp_servers:
  agents-remember:
    command: "uvx"
    args:
      - "--refresh-package"
      - "agents-remember-mcp"
      - "agents-remember-mcp@latest"
      - "--config"
      - "<PATH/TO/YOUR/PROJECTS_FOLDER>/.hermes/mcp/agents-remember-settings.json"
