# Update instructions:
#
# edit the mcp/pyproject.toml
# version = "0.2.0"
# git add mcp/pyproject.toml
# git commit -m "Release MCP 0.1.1"
# git tag mcp-v0.2.0
# git push origin main
# git push origin mcp-v0.2.0

name: Publish MCP package to PyPI

on:
  push:
    tags:
      - "mcp-v*"

jobs:
  build:
    name: Build MCP package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Acceptance belongs to the lifecycle: targeted once when each leaf commits,
      # then full once when its master integrates. Publishing proves that the tagged
      # commit landed on main instead of spending either acceptance boundary again.
      - name: Refuse a tag whose commit has not landed on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "release tag must point to a commit reachable from origin/main" >&2
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"

      - name: Prove the exact Python runtime
        run: |
          . scripts/python-runtime-contract.env
          python scripts/check-python-runtime.py \
            --expected-version "$AR_PYTHON_VERSION" \
            --require-linux-pidfd

      - name: Install locked Python build dependencies
        run: |
          . scripts/python-runtime-contract.env
          python -m pip install --disable-pip-version-check "uv==$AR_UV_VERSION"
          UV_PROJECT_ENVIRONMENT=mcp/.venv uv sync \
            --project mcp \
            --python "$(command -v python)" \
            --no-managed-python \
            --frozen \
            --all-extras
          uv pip check --python mcp/.venv/bin/python

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # The cockpit bundle is a generated artifact and is no longer committed, so the
      # release job owns building it. A failure here fails the release; there is no
      # path that publishes a wheel without a dashboard.
      - name: Build dashboard bundle
        working-directory: dashboard
        run: npm run build

      # Package data is read from the source tree at build time, so the bundle has to be
      # in place before `python -m build` runs. `scripts/sync-dashboard.py` owns that
      # placement: it refuses a `dist` that was not built from the current source, and it
      # writes the `dashboard.fingerprint` sidecar that serving/build_info.py reports as
      # `servingBuild.dashboardBuild`. A plain copy would ship the bundle without its
      # build identity.
      - name: Place dashboard bundle into MCP package data
        run: mcp/.venv/bin/python scripts/sync-dashboard.py

      - name: Build wheel and sdist
        working-directory: mcp
        run: .venv/bin/python -m build

      # Removing the bundle from version control makes "the release quietly shipped no
      # dashboard" a reachable failure. Assert both distributions carry the bundle and the
      # fingerprint sidecar serving/build_info.py reads to report `servingBuild`.
      - name: Verify the distributions ship the dashboard bundle
        working-directory: mcp
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import tarfile
          import zipfile

          REQUIRED = (
              "agents_remember/package_data/dashboard/index.html",
              "agents_remember/package_data/dashboard.fingerprint",
          )
          dist = pathlib.Path("dist")

          def only(pattern: str) -> pathlib.Path:
              matches = sorted(dist.glob(pattern))
              if len(matches) != 1:
                  sys.exit(f"expected exactly one {pattern} in {dist}, found {len(matches)}")
              return matches[0]

          wheel = only("*.whl")
          sdist = only("*.tar.gz")

          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdist) as archive:
              sdist_names = archive.getnames()

          missing = [
              f"{path.name}: {needle}"
              for path, names in ((wheel, wheel_names), (sdist, sdist_names))
              for needle in REQUIRED
              if not any(name.endswith(needle) for name in names)
          ]
          if missing:
              sys.exit("release artifact is incomplete -- missing " + "; ".join(missing))
          print(f"dashboard bundle and fingerprint present in {wheel.name} and {sdist.name}")
          PY

      - name: Install and start the wheel in a clean Python 3.13 environment
        run: |
          wheel="$(find mcp/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv /tmp/agents-remember-wheel-check
          /tmp/agents-remember-wheel-check/bin/python -m pip install "$wheel"
          /tmp/agents-remember-wheel-check/bin/agents-remember-mcp --help

      - name: Upload package distributions
        uses: actions/upload-artifact@v5
        with:
          name: agents-remember-mcp-dist
          path: mcp/dist/

  publish:
    name: Publish MCP package to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/agents-remember-mcp

    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v6
        with:
          name: agents-remember-mcp-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
