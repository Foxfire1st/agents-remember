name: Quality checks

on:
  # The pull request owns GitHub-side validation. Ordinary branch pushes do not launch
  # a duplicate workflow. Acceptance remains lifecycle-owned: targeted at leaf closeout
  # and full at master integration, never by GitHub CI.
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-linux:
    name: Deterministic repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Read the uv minor line from the runtime contract
        id: runtime-contract
        run: |
          . scripts/python-runtime-contract.env
          printf 'uv-version=%s.x\n' "$AR_UV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.runtime-contract.outputs.uv-version }}
          enable-cache: false

      - name: Record the installed uv version
        run: |
          printf 'setup-uv resolved version: %s\n' "${{ steps.setup-uv.outputs.uv-version }}"
          uv --version

      - name: Install locked Python development dependencies
        run: scripts/bootstrap-mcp-venv.sh

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run deterministic non-test checks
        run: ./.githooks/_gate.sh targeted
