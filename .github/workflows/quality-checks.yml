name: Quality checks

on:
  # Every branch, not only `main`. The gate has to reach work while it is still
  # small; scoping it to `main` meant the first automated verdict on a long-lived
  # branch arrived once, in one enormous pull request.
  #
  # Naming `branches` also excludes tag pushes, so a release tag runs this workflow
  # exactly once -- through the `workflow_call` below, from publish-mcp-to-pypi.yml.
  push:
    branches: ["**"]
  # Every pull request, whatever its base branch.
  pull_request:
  # Callable so the release path can require this gate on the tagged tree.
  # Consumer: .github/workflows/publish-mcp-to-pypi.yml (job `quality`).
  workflow_call:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality wrapper (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Full history, not the default single commit. The wrapper's changed-lines
      # coverage floor diffs against the merge base with the branch's source; a
      # shallow clone has no merge base to find, which would silently turn the
      # strictest step of the gate into "compare against the empty tree".
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e "mcp[dev]"

      # The pytest fixtures create real git repos and commit, so a git identity
      # must exist or they fail with "unable to auto-detect email address".
      - name: Configure git identity for hermetic test fixtures
        run: |
          git config --global user.email "ci@agents-remember.invalid"
          git config --global user.name "Agents Remember CI"

      # Enforces ALL of: ruff (lint, complexity rules C901/PLR0911/PLR0912/PLR0915
      # included), `ruff format --check`, Pyright (types), the full pytest suite,
      # CRAP (complexity x branch coverage) and the changed-lines coverage floor.
      # The wrapper exits non-zero if ANY of them fail; CRAP threshold enforcement
      # is mandatory in the default command. Nothing here is baselined or
      # allowlisted -- the complexity baseline this job used to run was deleted
      # with the debt it recorded. Its two Radon steps are labelled reports and
      # cannot fail it -- radon exits 0 whatever it finds -- so they are not named
      # here.
      #
      # The coverage floor needs the base branch to diff against. `fetch-depth: 0`
      # above gives it the history; on a pull request it reads `GITHUB_BASE_REF`
      # itself, and on a branch push it falls back to the merge base with the
      # remote's default branch. The base it used is printed in the step output.
      - name: Run quality wrapper (ruff + format + Pyright + pytest + CRAP + diff coverage)
        run: python -m agents_remember.code_quality.check

  dashboard:
    name: Dashboard frontend rail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Unit tests
        working-directory: dashboard
        run: npm run test

      # The bundle is a generated artifact and is no longer committed, so there is
      # nothing to compare a fresh build against. Proving the frontend still builds
      # is the whole check here; the release job builds it again and ships it.
      - name: Build
        working-directory: dashboard
        run: npm run build
