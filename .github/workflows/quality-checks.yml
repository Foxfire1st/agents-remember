name: Quality checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality wrapper (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e "mcp[dev]"

      # The pytest fixtures create real git repos and commit, so a git identity
      # must exist or they fail with "unable to auto-detect email address".
      - name: Configure git identity for hermetic test fixtures
        run: |
          git config --global user.email "ci@agents-remember.invalid"
          git config --global user.name "Agents Remember CI"

      # Enforces ALL of: ruff (lint), Pyright (types), the full pytest suite, and
      # CRAP (complexity x coverage). The wrapper exits non-zero if ANY of them
      # fail; --fail-on-crap-threshold adds CRAP as the fourth hard gate.
      - name: Run quality wrapper (ruff + Pyright + pytest + CRAP, enforcing)
        run: python -m agents_remember.code_quality.check --fail-on-crap-threshold
