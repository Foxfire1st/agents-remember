name: Quality checks

on:
  # Run on every branch push. Tag releases call this workflow from publish-mcp-to-pypi.yml.
  push:
    branches: ["**"]
  # Every pull request, whatever its base branch.
  pull_request:
  # Callable so the release path can require this gate on the tagged tree.
  # Consumer: .github/workflows/publish-mcp-to-pypi.yml (job `quality`).
  workflow_call:
  # Run the randomized collection-order rail on its weekly schedule.
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality wrapper (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Full history is required for the changed-lines coverage merge base.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e "mcp[dev]"

      # The pytest fixtures create real git repos and commit, so a git identity
      # must exist or they fail with "unable to auto-detect email address".
      - name: Configure git identity for hermetic test fixtures
        run: |
          git config --global user.email "ci@agents-remember.invalid"
          git config --global user.name "Agents Remember CI"

      # Enforce cheap deterministic rails first, full pytest as the final subprocess, then
      # CRAP and changed-lines coverage from pytest's artifact. CI explicitly runs fresh;
      # content-addressed delta proof reuse is local retry behavior only.
      - name: Run quality wrapper (cheap rails, pytest, then coverage-derived rails)
        env:
          AR_QUALITY_INVOCATION: ci
        run: python -m agents_remember.code_quality.check

  dashboard:
    name: Dashboard frontend rail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: |
          PYTHONPATH=../mcp/src python3 -m agents_remember.code_quality.scope_reporting --project-root .. dashboard --step lint
          if npm run lint; then echo "result: dashboard-lint PASS"; else echo "result: dashboard-lint FAIL"; exit 1; fi

      - name: Typecheck
        working-directory: dashboard
        run: |
          PYTHONPATH=../mcp/src python3 -m agents_remember.code_quality.scope_reporting --project-root .. dashboard --step typecheck
          if npm run typecheck; then echo "result: dashboard-typecheck PASS"; else echo "result: dashboard-typecheck FAIL"; exit 1; fi

      - name: Unit tests
        working-directory: dashboard
        run: |
          PYTHONPATH=../mcp/src python3 -m agents_remember.code_quality.scope_reporting --project-root .. dashboard --step test
          if npm run test; then echo "result: dashboard-test PASS"; else echo "result: dashboard-test FAIL"; exit 1; fi

      # Coverage: global thresholds via the Vitest v8 provider, then the changed-lines floor
      # (coverage:diff) against the merge base — the frontend mirror of the Python diff gate.
      - name: Coverage thresholds + changed-lines floor
        working-directory: dashboard
        run: |
          PYTHONPATH=../mcp/src python3 -m agents_remember.code_quality.scope_reporting --project-root .. dashboard --step coverage
          if npm run test:coverage; then echo "result: dashboard-coverage PASS"; else echo "result: dashboard-coverage FAIL"; exit 1; fi
          PYTHONPATH=../mcp/src python3 -m agents_remember.code_quality.scope_reporting --project-root .. dashboard --step diff-coverage
          if npm run coverage:diff; then echo "result: dashboard-diff-coverage PASS"; else echo "result: dashboard-diff-coverage FAIL"; exit 1; fi

      # The primary Playwright config drives the real app against the fixture gallery
      # (/dev/bench) — no live server/sim needed — so it runs in CI on every push/PR.
      - name: End-to-end (Playwright, primary config)
        working-directory: dashboard
        run: |
          npx playwright install --with-deps chromium
          PYTHONPATH=../mcp/src python3 -m agents_remember.code_quality.scope_reporting --project-root .. dashboard --step e2e
          if npm run e2e; then echo "result: dashboard-playwright PASS"; else echo "result: dashboard-playwright FAIL"; exit 1; fi

      # Require the generated frontend bundle to build successfully.
      - name: Build
        working-directory: dashboard
        run: |
          PYTHONPATH=../mcp/src python3 -m agents_remember.code_quality.scope_reporting --project-root .. dashboard --step build
          if npm run build; then echo "result: dashboard-build PASS"; else echo "result: dashboard-build FAIL"; exit 1; fi

  clean-linux:
    name: Dagger Ubuntu install + Codex protocol + quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the changed-lines base
        run: |
          base="$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")"
          echo "AR_CLEAN_DIFF_BASE=${base}" >> "${GITHUB_ENV}"

      - name: Materialize the exact Git ancestry bundle
        run: git bundle create "${RUNNER_TEMP}/agents-remember-quality.bundle" HEAD

      - name: Export reports from the pinned Dagger Ubuntu pipeline
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v0.21.8"
          verb: call
          args: >-
            quality --source=. --repository-bundle=${{ runner.temp }}/agents-remember-quality.bundle
            --mode=full --diff-base=${{ env.AR_CLEAN_DIFF_BASE }}
            reports export --path=${{ runner.temp }}/agents-remember-clean/reports

      - name: Enforce the cached Dagger result
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v0.21.8"
          verb: call
          args: >-
            verify --source=. --repository-bundle=${{ runner.temp }}/agents-remember-quality.bundle
            --mode=full --diff-base=${{ env.AR_CLEAN_DIFF_BASE }}

      - name: Upload the self-overwriting clean-room reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-linux-reports
          path: ${{ runner.temp }}/agents-remember-clean/reports/
          if-no-files-found: error

  randomized-order:
    name: Scheduled randomized Python test order
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e "mcp[dev]"

      - name: Configure git identity for hermetic test fixtures
        run: |
          git config --global user.email "ci@agents-remember.invalid"
          git config --global user.name "Agents Remember CI"

      - name: Run full suite in deterministic randomized order
        env:
          RANDOM_ORDER_SEED: ${{ github.run_id }}
        run: |
          PYTHONPATH=mcp/src python -m agents_remember.code_quality.scope_reporting randomized-pytest --seed "${RANDOM_ORDER_SEED}"
          if python -m pytest mcp/tests --random-order-seed="${RANDOM_ORDER_SEED}"; then echo "result: randomized-pytest PASS"; else echo "result: randomized-pytest FAIL"; exit 1; fi
