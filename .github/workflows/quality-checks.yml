name: Quality checks

on:
  # The pull request owns GitHub-side validation. Ordinary branch pushes do not launch
  # a duplicate workflow. Acceptance remains lifecycle-owned: targeted at leaf closeout
  # and full at master integration, never by GitHub CI.
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-linux:
    name: Deterministic repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"

      - name: Prove the exact Python runtime
        run: |
          . scripts/python-runtime-contract.env
          python scripts/check-python-runtime.py \
            --expected-version "$AR_PYTHON_VERSION" \
            --require-linux-pidfd

      - name: Install locked Python development dependencies
        run: |
          . scripts/python-runtime-contract.env
          python -m pip install --disable-pip-version-check "uv==$AR_UV_VERSION"
          UV_PROJECT_ENVIRONMENT=mcp/.venv uv sync \
            --project mcp \
            --python "$(command -v python)" \
            --no-managed-python \
            --frozen \
            --all-extras
          uv pip check --python mcp/.venv/bin/python

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run deterministic non-test checks
        run: ./.githooks/_gate.sh targeted
