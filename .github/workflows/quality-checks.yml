name: Quality checks

on:
  # The pull request owns GitHub-side validation. Ordinary branch pushes do not launch
  # a duplicate workflow. Acceptance remains lifecycle-owned: targeted at leaf closeout
  # and full at master integration, never by GitHub CI.
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-linux:
    name: Deterministic repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python development dependencies
        run: python -m pip install -e "mcp[dev]"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run deterministic non-test checks
        run: ./.githooks/_gate.sh targeted
