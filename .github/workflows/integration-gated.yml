name: Gated integration paths

# The environment-gated suites. `pyproject.toml` registers eight markers for tests that
# skip unless an `AR_*` variable opts them in; before this workflow nothing set any of
# them, so fourteen tests over the Pi RPC transport, the Codex app-server, the Claude
# stream-json transport, the L3 control routes, the production evidence seam and the
# real MCP stdio server were never executed by any automation.
#
# Two of the eight need no vendor account, and both run here. The other six need an
# installed, signed-in vendor CLI -- four of them bill for real model turns, and three
# additionally require exactly `codex 0.144.5` and `pi 0.80.7` on PATH. No CI runner can
# hold those credentials, so they are not faked here: `scripts/run-gated-integration.py`
# runs each of them locally in one command and states what it needs.
#
# Both jobs below are real. They fail the workflow on failure; there is no
# `continue-on-error` and no soft skip.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: gated-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-rpc-smoke:
    name: Pi RPC smoke (ar_run_pi_rpc_smoke)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package with dev extras
        run: python -m pip install -e "mcp[dev]"

      # The first test installs `@earendil-works/pi-coding-agent@0.80.7` into its own
      # temporary prefix and asserts that exact version, so it does not depend on this
      # step. The second takes whatever `pi` is on PATH and *skips itself* when there is
      # none -- which is how a runner ends up reporting success while running one test
      # instead of two. Installing the version the conversation-library helper pins
      # (mcp/native_helpers/conversation_library/package.json) is what makes the second
      # test actually run.
      - name: Install the pinned Pi runtime
        run: npm install --global @earendil-works/pi-coding-agent@0.80.7

      - name: Show the Pi version under test
        run: pi --version

      # No credential anywhere: two of the tests drive Pi with `--offline` against
      # http://127.0.0.1:9/v1, and the third stands up an in-process HTTP server on
      # 127.0.0.1 that speaks OpenAI-shaped server-sent events.
      #
      # `--require-passed 3` is the anti-skip guard. The PATH-dependent test skips itself
      # when `pi` is absent, and a skipped test exits 0 -- so without this the job would
      # go green while running part of what it claims to. The count is read from pytest's
      # own JUnit report, not from its summary text. It covers the pinned-install
      # handshake, the capability recording re-verified against that install, and the
      # busy-guard test.
      - name: Run the Pi RPC smoke
        run: python scripts/run-gated-integration.py ar-run-pi-rpc-smoke --require-passed 3

  real-mcp-config:
    name: Real MCP server (agents_remember_real_mcp_config)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e "mcp[dev]"

      # `AGENTS_REMEMBER_REAL_MCP_CONFIG` wants a settings file, not a credential. The
      # runner script generates one -- temp coordination and workspace roots, this
      # repository as the single repo id, the two self-hosted provider entries -- and
      # the suite then spawns this repository's own MCP server over stdio against it.
      # Nothing in that path reaches a vendor.
      #
      # `--dry-run-only` selects the planning test. Its sibling in the same class runs a
      # live grepai search, which needs the self-hosted docker stack up and indexed
      # (ar-grepai-postgres / ar-grepai-ollama / ar-grepai-watcher, with an embedding
      # model pulled). That is infrastructure, not a credential, and it is the one thing
      # here a hosted runner is a poor place for; `run-gated-integration.py
      # agents-remember-real-mcp-config` without the flag runs both against a local
      # stack.
      - name: Run the real MCP stdio integration (planning path)
        run: >-
          python scripts/run-gated-integration.py agents-remember-real-mcp-config
          --dry-run-only --require-passed 1

# There is no third job policing the inventory. That check belongs in the suite, where
# it runs on every developer machine and in the quality wrapper rather than only here:
# `mcp/tests/test_gated_integration_runner.py` asserts that every marker registered in
# `pyproject.toml` is applied to at least one test and has an entry in
# `scripts/run-gated-integration.py`, in both directions.
