services:
  falkordb:
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes"
      # The falkordb image defaults to "MAX_QUEUED_QUERIES 25", which is far too small once
      # several cgc watchers (one per repo) plus a reindex run share this single FalkorDB:
      # each cgc indexer self-throttles to ~10 in-flight queries (asyncio.Semaphore(10) in
      # codegraphcontext, writes batched via UNWIND), so total demand is bounded by
      # (#concurrent indexers) x 10 -- independent of repo size. A bounded 1024-deep queue
      # therefore absorbs ~100 concurrent indexers without ever rejecting ("Max pending
      # queries exceeded") and without unbounded memory. TIMEOUT/RESULTSET_SIZE keep the
      # image defaults (this env replaces FALKORDB_ARGS wholesale).
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 1024 TIMEOUT 1000 RESULTSET_SIZE 10000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  runner:
    profiles: ["run"]
    entrypoint: ["cgc"]
    depends_on:
      falkordb:
        condition: service_healthy
