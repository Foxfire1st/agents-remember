[tool.ruff]
line-length = 100
# The supported floor, not the newest interpreter. `mcp/pyproject.toml` declares
# `requires-python = ">=3.11"` and CI runs 3.11, 3.12 and 3.13, so a tool told to target
# py313 offers rewrites the floor cannot execute. That was not hypothetical: seven
# `# noqa: UP040 / UP046 / UP047` directives in `serving/conversation/` and
# `observer/projection_inputs.py` carried the reason "Python 3.11 support" -- PEP 695
# `type` statements and generic syntax that 3.11 does not parse. Pinning the target to the
# floor makes Ruff agree with the package metadata, and those seven suppressions were
# deleted in the same change because the rules no longer fire. Raising this line again
# means putting them back, which is the visible cost the mismatch used to hide.
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "ARG",
  "PL",
  "RUF",
  "C901", # Enforces [tool.ruff.lint.mccabe] max-complexity, which was configured but unselected.
]
ignore = [
  "E501", # Ruff format owns wrapping; long literals stay readable as-is.
  # PLR0911/PLR0912/PLR0915 are absent from this list on purpose, and nothing anywhere else
  # softens them. They used to be ignored "because Radon reports complexity pressure", which
  # deferred enforcement to the one tool that cannot enforce -- radon exits 0 whatever it
  # finds. Switching them on with C901 produced 67 offenders; those were first parked in
  # quality/complexity-baseline.txt behind a shrink-only ratchet with a dated burn-down, and
  # the developer overruled that. All 67 were refactored in 260731-EFA-L2, the baseline file
  # and its gate step were deleted, and the four codes are now enforced by ruff directly in
  # the wrapper, the pre-commit tier and CI alike. There is no per-file ignore, noqa or
  # allowlist for any of them; an offender is fixed, never recorded.
  "PLR2004", # Numeric parser/state-machine sentinels are clearer inline.
  # PLR0913 is absent from this list on purpose, and there is no `max-args` override either --
  # the rule runs at Ruff's default of 5, which is the number the memory root's
  # `system/coding-guidelines.md` already states. It used to be ignored here with a comment
  # deferring 293 findings to a future leaf.
  # 274 of those were refactored outright in 260731-EFA-L2 (163 parameter objects
  # introduced across the tree, including the 27 -> 24 -> 25 keyword pass-through in
  # serving/terminal_opener.py that comment blamed, now 4 -> 5 -> 4 through
  # TerminalLaunchRequest / SpawnProvenance / HostedSessionRuntime). The remaining 19 are one
  # category, carved out by path below rather than deferred by rule.
]

[tool.ruff.lint.per-file-ignores]
"mcp/tests/*.py" = [
  "ARG001", # Test doubles intentionally match patched callable signatures.
  "ARG005", # Test doubles intentionally match patched callable signatures.
  "E402",   # Tests insert mcp/src before importing the package under test.
]
# The `@server.tool()` declarations, and nothing else. In these modules a parameter list is
# not a call burden -- it IS the published MCP input schema. FastMCP derives each tool's JSON
# schema from the Python signature, so the extraction PLR0913 asks for is a wire change, not a
# refactor. Measured against the installed mcp 1.28.1:
#
#     def flat(repo_id, task_name, leaf_id)  -> properties: [repo_id, task_name, leaf_id]; no $defs
#     def nested(args: SomeModel)            -> properties: [args];                        has $defs
#
# A model-typed parameter does not flatten -- it republishes the tool as a single nested
# object, so `{"leaf_key": ...}` becomes `{"seat": {"leaf_key": ...}}` for every client, every
# row of docs/reference/mcp-tools.md and every flat-kwargs call in the c-09 and l-01 skills.
#
# This is the category the standard already carves out. The memory root's
# `system/coding-guidelines.md` sets both halves: the bar this rule enforces ("Function
# arguments | <= 5 normal args | Use a dataclass/config object when arguments represent a
# concept") and the exemption for what is "explicitly boring: generated output, static data,
# fixtures, or intentionally centralized declarations". A published tool signature is the last
# of those, and this directory is the whole of that category in this tree.
#
# The carve-out is self-limiting, not a hiding place. Each of these bodies already packs its
# flat parameters straight into the concept object the domain layer takes (SpawnSeat, TaskRef,
# GateVerdict, CarryoverSelection, CloseoutCommitMessages ...), so no ordinary logic lives
# here -- and `mcp/tests/test_code_quality_check.py::ToolSignatureExemptionTests` holds that
# shut: it walks the AST of every file this pattern matches and fails if any function in them
# is anything but a `@server.tool()` declaration or the registrar that hosts them, and it
# fails if this pattern is widened or a second PLR0913 exemption is added anywhere.
"mcp/src/agents_remember/mcp/registration/*.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
# The whole checkout, matching what the gate actually type-checks. This key used to read
# `["mcp/src/agents_remember", "mcp/tests"]`, a second hand-written copy of the scope
# constant `code_quality/check.py` no longer has. It was already dead for the gate -- the
# wrapper passes explicit files, which overrides `include` -- but it was live for editors
# and for a bare `pyright` run, where it under-covered the tree by 17 files including all
# three `scripts/sync-*.py`. Two scopes, one of them silently narrower, is the exact shape
# of the hole 260731-EFA-L2 exists to close. Verified 2026-07-31: a bare `pyright` over
# this include reports 0 errors, so widening it costs nothing and stops the config from
# disagreeing with the gate.
include = ["."]
exclude = [
  "**/__pycache__",
  ".cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "node_modules",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
executionEnvironments = [
  { root = "mcp/src", extraPaths = ["mcp/src"] },
  { root = "mcp/tests", extraPaths = ["mcp/src", "mcp/tests"] },
]

[tool.coverage.run]
# The first coverage configuration this repository has ever had. Until now the
# only coverage settings were the `--cov=` flags the quality wrapper passes on
# the command line, so every default was whatever Coverage.py ships.
#
# CRAP is defined over *branch* coverage -- `crap = cc**2 * (1 - branch_cov)**3 + cc`
# -- and the wrapper was feeding it statement coverage. That is generous in
# exactly the place complexity lives: an `if` line counts as executed the first
# time it is evaluated, whether or not the false arm was ever taken, so the
# metric is most forgiving of the branches the complexity term is counting.
#
# What this setting does, measured on a controlled probe rather than assumed.
# Turning it on adds `executed_branches`, `missing_branches` and the branch
# fields of `summary` to the JSON report, and leaves `executed_lines` and
# `missing_lines` unchanged -- a partially-taken branch is recorded in
# `missing_branches`, never in `missing_lines`.
#
# `code_quality/crap_calculator.py` consumes those branch fields, and refuses to
# score a report whose `meta.branch_coverage` is not true. Turning this line off
# therefore breaks the gate loudly instead of quietly returning CRAP to the
# statement coverage it is not defined over. Measured on 2026-07-31, consuming
# them is worth having: it moves the coverage ratio of 1,705 of 4,469 scored
# functions and drops their mean from 87.61% to 85.62%, with individual functions
# falling as far as 30.0% -> 22.2% (serving/app.py:267 `_looks_like_image`).
#
# The aggregate figure moves too, because Coverage.py scores branches into it:
# 88.59% statements alone (38,028/42,925), 74.65% branches alone
# (9,517/12,748), 85.40% reported. Anything that pins a number to today's
# coverage must be re-derived against the 85.40%, not the 88.59%.
branch = true

[tool.radon]
# Show only functions/classes that are at least mildly complex.
# A = 1-5, B = 6-10, C = 11-20, D = 21-30, E = 31-40, F = 41+
cc_min = "B"
cc_max = "F"

# Make the output useful for refactor scouting.
show_complexity = true
average = true
total_average = true
order = "SCORE"

# Maintainability Index:
# A = high maintainability, B = medium, C = very low.
# This hides healthy A files and shows B/C pressure points.
mi_min = "B"
mi_max = "C"
show_mi = true

# Keep generated/cache/vendor-ish paths out of the report.
# Use comma-separated strings rather than TOML arrays; Radon has had
# pyproject parsing rough edges with arrays.
#
# `tests/*,*/tests/*` used to lead this list and was removed on 2026-07-31.
# Radon applies these patterns even to an explicitly named path, so the entry
# did not merely keep tests out of a default scan -- it made `radon cc mcp/tests`
# print nothing at all. Measured from a directory where this pyproject is not
# discovered, that silence was hiding the only E- and F-rank blocks in the
# repository: cc=52 in mcp/tests/test_codex_app_server_live.py:158 and cc=36 in
# mcp/tests/test_codex_history_production_path.py:279. A metric you cannot ask
# for is not a metric. What the gate *runs* over is decided by the wrapper's
# arguments, not here.
exclude = ".venv/*,venv/*,build/*,dist/*,.git/*,__pycache__/*"
ignore = ".git,.hg,.mypy_cache,.pytest_cache,.ruff_cache,.venv,venv,node_modules,dist,build,__pycache__"

# Usually better for real complexity pressure:
# asserts should count as branches unless you intentionally use them as non-runtime checks.
no_assert = false

[tool.pytest.ini_options]
# The first pytest configuration this repository has ever had. There was no
# `pytest.ini`, `setup.cfg` or `tox.ini` either, so every strictness switch below was
# off by default and there was nowhere to declare a marker.
minversion = "9.0"

# The single declaration of where the suite lives. `code_quality/check.py` reads this
# key to build its pytest step, so the wrapper no longer carries a second copy that can
# drift out of step with pytest itself.
testpaths = ["mcp/tests"]

addopts = [
  # An unregistered marker is a typo that quietly selects nothing. Fail on it.
  "--strict-markers",
  # An unknown or misspelled ini key is a setting that quietly does nothing. Fail on it.
  "--strict-config",
]

# The house convention is `<Subject>Tests`, not pytest's default `Test<Subject>`. All
# 485 such classes currently reach `unittest.TestCase`, which pytest collects whatever
# `python_classes` says, so this changes nothing today -- 3077 tests collected with and
# without it on 2026-07-31. It closes the prospective hole: a plain `PlainTests` class
# that does not subclass TestCase is silently skipped, with no error and no report.
python_classes = ["Test*", "*Tests"]

# An xfail that starts passing is either a bug someone fixed without noticing or a test
# that stopped testing. Both should be seen rather than absorbed.
xfail_strict = true

# Warnings are errors, with named exceptions.
#
# Measured rather than assumed. A bare `filterwarnings = ["error"]` does not merely fail
# this suite, it *hangs* it: uvicorn's websockets shim emits a DeprecationWarning while
# importing `websockets.server`, and raising that inside the server startup path leaves
# the conversation-active tests blocked in `epoll_wait` for good (observed 2026-07-31 --
# the run stopped at test 496 of 3077 and never advanced). Every entry below was found
# by running the whole suite under `filterwarnings = ["always"]` and reading the
# summary, so the list is exactly what this tree emits and nothing wider.
#
# Each ignore is pinned to a message *and* a category, so an ignore can only ever silence
# the exact notice it was measured against and never a class of them.
#
# Every entry left is third party and unreachable from here. The two that were ours were
# fixed rather than ignored, in this same change: `providers/grepai/seed.py` now enters its
# `Popen` as a context manager, so a `stdout=PIPE` caller's read end is closed by the code
# that opened it (test_seed_timeouts StallWatchdogTests, 4 tests); `_spawn_sleeper` in
# test_dashboard_daemon.py closes the readiness pipe it reads one line from (StopTests, 2
# tests); and the dashboard sim's throwaway coordination root is now closed by its owner --
# `cli/dashboard.py::run` after the server stops, and `SimReplayTests._build_sim` via
# addCleanup (test_serving.py, 5 tests). `mcp/tests/test_code_quality_check.py::
# test_the_warning_ignore_list_is_capped` asserts the exact remaining count, so an entry
# cannot be added or paid off without a visible edit to a test.
filterwarnings = [
  "error",

  # --- third party: not fixable from this repository -------------------------
  # starlette warns at import of `starlette.testclient` that httpx2 is the supported
  # client, and fastapi's TestClient re-exports it. This fires at *collection* of the
  # eleven serving test modules, so without this line the run dies before it starts.
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  # uvicorn's websockets protocol module imports `websockets.server.WebSocketServerProtocol`
  # and `websockets.legacy`, both deprecated in websockets >= 14. These are the two that
  # hang the suite when raised. Gone when uvicorn moves to the new websockets API, which is
  # a dependency bump rather than a change here.
  "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
  "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

# Environment-gated integration paths. Eight of them, guarding fifteen tests: each is
# guarded by an `AR_*` variable and skips when it is unset, so nothing exercises them
# unless something sets it.
#
# Registering a marker is not the same as applying one, and for a while this list was
# only the first. Every entry below was registered and documented while the tests
# carried no `@pytest.mark.<name>` at all, so `pytest -m ar_run_pi_rpc_smoke` selected
# *nothing* -- 0 of 3402, reported as a successful run of an empty selection, because
# `--strict-markers` rejects an unknown marker and has nothing to say about a registered
# one that decorates no test. All eight are applied now, and
# `mcp/tests/test_gated_integration_runner.py` fails if any of them selects zero tests
# again.
#
# Nothing ran them either. `scripts/run-gated-integration.py` is the one command per
# path, and `.github/workflows/integration-gated.yml` runs the two that need no vendor
# account -- `ar_run_pi_rpc_smoke`, which installs its own Pi build and drives it
# offline against 127.0.0.1, and `agents_remember_real_mcp_config`, which spawns this
# repository's own MCP server against a generated settings file. The other six need an
# installed, signed-in vendor CLI and four of them bill for real model turns, so they
# run locally and the runner states what each one needs.
#
# `mcp/tests/test_code_quality_check.py` asserts this list and the suite's actual
# environment gates stay in step in both directions.
markers = [
  "ar_run_pi_rpc_smoke: opt in with AR_RUN_PI_RPC_SMOKE=1 -- installs and drives the pinned Pi RPC build (test_pi_rpc_real_smoke.py: 1 class)",
  "ar_run_control_plane_installed: opt in with AR_RUN_CONTROL_PLANE_INSTALLED=1 -- drives installed Codex and Pi runtimes through the control-plane seam (test_harness_control_plane_installed.py: 2 classes)",
  "ar_run_control_installed: opt in with AR_RUN_CONTROL_INSTALLED=1 -- drives installed runtimes through the L3 control routes (test_conversation_control_installed.py: 2 classes)",
  "ar_run_evidence_installed: opt in with AR_RUN_EVIDENCE_INSTALLED=1 -- drives installed runtimes through the production evidence seam (test_harness_control_evidence_installed.py: 2 classes)",
  "ar_claude_stream_smoke: opt in with AR_CLAUDE_STREAM_SMOKE=1 -- live Claude stream-json smoke against the installed binary (test_harness_control_claude_smoke.py: 1 class)",
  "ar_codex_app_server_live_smoke: opt in with AR_CODEX_APP_SERVER_LIVE_SMOKE=1 -- credential-safe live Codex app-server handshake, sends no prompt (test_codex_app_server_live.py: 1 test)",
  "ar_codex_app_server_live_conformance: opt in with AR_CODEX_APP_SERVER_LIVE_CONFORMANCE=1 -- bounded live Codex conformance, sends two tiny turns (test_codex_app_server_live.py: 1 test)",
  # Same hazard, older naming: an environment-gated integration path that predates the AR_ prefix.
  "agents_remember_real_mcp_config: opt in by pointing AGENTS_REMEMBER_REAL_MCP_CONFIG at a real MCP config -- real MCP server integration (test_tools.py: 1 class)",
]
