[tool.ruff]
line-length = 100
# Match the package's only supported Python minor line.
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "ARG",
  "PL",
  "RUF",
  "C901", # Enforce [tool.ruff.lint.mccabe] max-complexity.
]
ignore = [
  "E501", # Ruff format owns wrapping; long literals stay readable as-is.
  # PLR0911/PLR0912/PLR0915 remain enforced with C901 by Ruff in the wrapper, hooks, and CI.
  # They have no baseline, per-file ignore, noqa, or allowlist; refactor each offender.
  "PLR2004", # Numeric parser/state-machine sentinels are clearer inline.
  # PLR0913 uses Ruff's default maximum of five arguments. The guarded registration-only
  # exemption below covers published MCP tool signatures.
]

[tool.ruff.lint.per-file-ignores]
"mcp/tests/*.py" = [
  "ARG001", # Test doubles intentionally match patched callable signatures.
  "ARG005", # Test doubles intentionally match patched callable signatures.
  "E402",   # Tests insert mcp/src before importing the package under test.
]
# FastMCP derives the published flat input schema from each ``@server.tool()`` signature;
# replacing it with a model parameter changes the wire shape to a nested object. This exemption
# is limited to registration modules. ``ToolSignatureExemptionTests`` rejects ordinary logic,
# a widened path, or any second PLR0913 exemption.
"mcp/src/agents_remember/mcp/registration/*.py" = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
# Bare Pyright and editors cover the whole checkout. The quality wrapper supplies its validated
# index-known file scope explicitly.
include = ["."]
exclude = [
  "**/__pycache__",
  ".cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "node_modules",
]
pythonVersion = "3.13"
typeCheckingMode = "basic"
# The wrapper supplies its selected interpreter through ``--pythonpath`` so primary and linked
# worktrees resolve the same environment; do not add checkout-local venvPath/venv declarations.
executionEnvironments = [
  { root = "mcp/src", extraPaths = ["mcp/src"] },
  { root = "mcp/test_support", extraPaths = ["mcp/src", "mcp/test_support"] },
  { root = "mcp/tests", extraPaths = ["mcp/src", "mcp/test_support", "mcp/tests"] },
  { root = "scripts", extraPaths = ["mcp/src", "mcp/test_support"] },
]

[tool.coverage.run]
# CRAP and diff coverage consume Coverage.py statement and branch units. The CRAP reader
# refuses JSON whose ``meta.branch_coverage`` is not true; keep branch measurement enabled.
branch = true
# Real Python children contribute to delivery coverage; ordinary pytest remains unmeasured.
patch = ["subprocess"]

[tool.agents_remember]
# S4 (260731-EFA-L7): armed at full scope after L16 landed and worktree_sync completed
# (manager signal 01KZAMC4CWQXF2ZVTW2N9PC7AG). Arming is not a threshold change and carries
# no baseline, allowlist, or per-file exemption. Any file at or above the 1,200-line hard
# limit in the detector's scope fails the wrapper.
file_size_armed = true
# Behavioral release rails follow operational ownership, not whether a module happens to be
# importable or installed by the development environment. Every tracked top-level Python package
# must appear in exactly one of these lists; adding an unclassified package fails the quality scope.
product_package_roots = ["mcp/src/agents_remember"]
verification_package_roots = [
  ".dagger/src/agents_remember_quality",
  "mcp/test_support/agents_remember_test_support",
]

[tool.radon]
# Show only functions/classes that are at least mildly complex.
# A = 1-5, B = 6-10, C = 11-20, D = 21-30, E = 31-40, F = 41+
cc_min = "B"
cc_max = "F"

# Make the output useful for refactor scouting.
show_complexity = true
average = true
total_average = true
order = "SCORE"

# Maintainability Index:
# A = high maintainability, B = medium, C = very low.
# This hides healthy A files and shows B/C pressure points.
mi_min = "B"
mi_max = "C"
show_mi = true

# Keep generated/cache/vendor-ish paths out of the report.
# Radon expects comma-separated exclusion strings.
#
# Exclude only vendor/cache/build paths. The wrapper command selects the production report
# population, while an explicit ``radon cc mcp/tests`` remains able to inspect tests.
exclude = ".venv/*,venv/*,build/*,dist/*,.git/*,__pycache__/*"
ignore = ".git,.hg,.mypy_cache,.pytest_cache,.ruff_cache,.venv,venv,node_modules,dist,build,__pycache__"

# Usually better for real complexity pressure:
# asserts should count as branches unless you intentionally use them as non-runtime checks.
no_assert = false

[tool.pytest.ini_options]
minversion = "9.0"
# Count parametrized items. Budget growth needs a documented protection/cost tradeoff,
# not coverage-driven additions or silently raising these limits.
#
# 2026-09-11 -- integration 150 -> 200, developer-decided. The population was saturated at 150 by
# the task-terminal/production-retirement change: two of its cases exercise real service-bound
# boundaries (a series must resume through worktree_attach instead of refusing its own kind, and a
# deleted integration branch must be named as the cause) and cannot run in the unit population,
# which has no bound worktree services. That left zero headroom for the next genuine boundary
# case, which is what the ceiling is for. Cost measured on this checkout the same day:
# integration 150 cases + 31 subtests in 31.8s; unit 795 cases + 145 subtests in 56.0s; combined
# 945 cases in 64.5s. The ceiling is headroom, not a target -- do not fill it.
#
# 2026-09-13 -- integration 200 -> 250, developer-authorized (explicitly raised by 50 so dropped
# coverage could be written back). The population was at 200 on this base -- 198 from the
# per-contract activation keying, plus 2 that had been CONSOLIDATED from 4 in the pause work
# because the old ceiling forced a merged case, and a merged case that can only fail as a unit is
# weaker evidence than two that fail independently. The eight pause cases below buy, one each: the
# no-publication measurement (refs, object databases, coordination tree, worktrees, destination
# branch); the hand-back payload (paused state, no next call, stop hint); the selection-missing
# refusal; pause idempotence; the leaf refusal; per-contract record isolation; the tampered-record
# refusal; and resume. Support cost is the existing QueueFixture plus five measurement helpers
# inside the one new module (tree digest, per-repository ref+object state, branch tips, task
# document statuses, assembled world snapshot) -- no new support module, no new shared artifact.
# Measured cost on this checkout at the raise:
# integration 206 cases + 31 subtests in 63.9s; unit 833 cases + 155 subtests in 53.9s; combined
# 1039 cases + 186 subtests in 105.6s, exit 0.
# 2026-09-15 -- unit 1000 -> 1100 and integration 250 -> 300, authorized by the orchestrator seat
# under the developer's standing authority for the LOCR campaign's 28 requirements across 39 leaf
# documents; the developer was consulted and directed the work to continue. Behavior bought: the
# campaign's falsifiable case per leaf, each pinning one distinct consequential failure of the
# lifecycle-owned completion relay rather than a coverage line. This raise is what keeps that work
# landable: in flight at the raise, L16 contributes +1 unit case, L15 +11 unit cases, and this
# leaf's L24 module +8, which puts the branch unit population at 1008 against the old ceiling of
# 1000 -- and an over-budget population does not run partially, `pytest_collection_finish` raises
# UsageError and the ENTIRE run executes zero tests, so the overflow would have broken every
# subsequent run for every leaf, with the L39 hardening leaf still to come. Case-count delta: unit
# 988 -> 1100, integration 247 -> 300 (both measured at the current master tip; this worktree's
# pre-change base measures 925 unit / 247 integration -- 933 unit with this leaf's own 8 new cases
# -- and the same 1000 / 250 there, so the raise is a no-op for populations already under the old
# ceiling). Size delta: one test module per contributing leaf, no new shared support module, no new
# artifact fixture. Runtime cost, measured on this checkout before the raise (unit lane: 933 cases +
# 189 subtests in 56.2s, 57.5s wall clock with `-n=4`; integration: 247 cases + 52 subtests in
# 62.1s, 63.4s wall clock). The raise itself adds no cases and therefore no runtime: it admits cases
# the campaign branches already authored, and it is headroom, not a target -- do not fill it.
# 2026-09-16 -- integration 250 -> 300, owner-authorized in the L6 fix round (260915-KS-L6).  The
# independent review that rejected the first attempt established that real protections were *missing*,
# not that cases were redundant, so the ceiling moves once to pay for them and for the two leaves still
# to come.  Allocation: L6 fix <=12, L7 <=18, L8 <=17, L9 <=3 (this supersedes the 250->285 allocation
# recorded in the master decision log).  This leaf's fix rounds use 6 of its 12: the staged
# sealed-aggregate read (an artifact whose payload_digest contradicts the revision row it names is
# refused before publish with the destination byte-identical, row-count-identical and digest-identical,
# for both revision tables and for *every* retained row of each); the import's close/verify step (a
# stage opened in WAL mode is published as a delete-mode database with no peer -- the L4/D-5 class);
# destination admission before any staging work (three destination states, each with its own code, and
# no private stage directory even requested); the whole-document canonical form (the reader accepts
# exactly one spelling -- envelope order, manifest order, declared column order, separators and sorted
# nested keys -- and refuses every other, which is what makes an accepted artifact re-encode to itself
# byte for byte and makes its digest a sound comparison); the freeze's own closure (the shared
# close/verify step proved from the freeze producer, not only from the import); and the typed read of an
# artifact that is not readable UTF-8 text (a value-or-refusal boundary, with no raw OSError or
# UnicodeDecodeError).  Support cost: no new shared artifact and no new support module -- the cases use
# the existing knowledge/merge/snapshot fixture modules plus helpers inside the two leaf test modules,
# which are split as test_knowledge_portable_roundtrip.py (1155 lines) and
# test_knowledge_portable_boundaries.py (685 lines) because one file may not exceed the 1200-line hard
# limit.  Measured cost on this checkout at the raise: integration population 249 -> 255 collected cases
# (counted under the filterwarnings override this host needs, see D-7); the executable integration lane
# is 255 cases + 41 subtests in 101.9s -- the four anyio-affected modules *do* execute here, and an
# intermittent xdist worker death on this host (an unrelated `assert not crashitem` at whichever node
# was running, seen with and without this leaf's modules present) can abort a full-lane run before it
# reports; that is a runner fault, not a lane bound, so re-run it rather than shrinking the lane (D-8);
# this leaf's 24-case portable population is 12.1s wall, and the 6 cases this round added to it are
# 4.2s wall of that; the 12-module knowledge population is 118 cases in 43.3s.  `unit_case_budget` is deliberately
# unchanged: the real unit population is 1003 under the same override, a pre-existing repository defect
# recorded as D-7 and routed to L9 -- no KS leaf may raise that ceiling.
# 2026-09-16 -- L6 fix round 3 (owner-extended, scoped) adds **no collected case**: the three
# protections it adds are driven inside the case that already owns each property (the header's declared
# type in the canonical-form case, the unrenderable-value refusal in the document-defect case, the
# namespace guard's refusal identity in the artifact-admission case), which is the doctrine's own
# preference for extending over piling on.  The population is therefore unchanged at 255, and the two
# line counts above are this candidate's measured sizes.
# 2026-09-16 -- merge note (260915-KS-L6 synced onto the official line).  The LOCR entry above sets
# `unit_case_budget` to 1100, which supersedes the "deliberately unchanged" note inside the
# 260915-KS entries below: no KS leaf raised the unit ceiling, and the 1003-case unit population this
# master measured under the filterwarnings override (D-7) now fits inside the LOCR ceiling, so D-7's
# shortfall is closed by the incoming official line rather than by any KS change.  Both sides'
# integration entries agree on 300; the two integration accounts above are kept as separate records.
unit_case_budget = 1100
integration_case_budget = 300

# The single declaration of where the suite lives. `code_quality/check.py` reads this
# key to build its pytest step, so the wrapper no longer carries a second copy that can
# drift out of step with pytest itself.
testpaths = ["mcp/tests"]

addopts = [
  # Ordinary edits exercise deterministic tests without delivery-only boundaries.
  "-m", "not integration",
  "-n=4",
  # An unregistered marker is a typo that quietly selects nothing. Fail on it.
  "--strict-markers",
  # An unknown or misspelled ini key is a setting that quietly does nothing. Fail on it.
  "--strict-config",
]

# Collect the repository's <Subject>Tests convention as well as pytest's Test<Subject>.
python_classes = ["Test*", "*Tests"]
# Imported fixture/test classes are exercised in their defining module only.
collect_imported_tests = false

# An xfail that starts passing is either a bug someone fixed without noticing or a test
# that stopped testing. Both should be seen rather than absorbed.
xfail_strict = true

# Warnings are errors, with named exceptions.
#
# Measured rather than assumed. A bare `filterwarnings = ["error"]` does not merely fail
# this suite, it *hangs* it: uvicorn's websockets shim emits a DeprecationWarning while
# importing `websockets.server`, and raising that inside the server startup path leaves
# the conversation-active tests blocked in `epoll_wait` for good (observed 2026-07-31 --
# the run stopped at test 496 of 3077 and never advanced). Every entry below was found
# by running the whole suite under `filterwarnings = ["always"]` and reading the
# summary, so the list is exactly what this tree emits and nothing wider.
#
# Each ignore is pinned to a message *and* a category, so an ignore can only ever silence
# the exact notice it was measured against and never a class of them.
#
filterwarnings = [
  "error",

  # --- third party: not fixable from this repository -------------------------
  # starlette warns at import of `starlette.testclient` that httpx2 is the supported
  # client, and fastapi's TestClient re-exports it. This fires at *collection* of the
  # eleven serving test modules, so without this line the run dies before it starts.
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  # uvicorn's websockets protocol module imports `websockets.server.WebSocketServerProtocol`
  # and `websockets.legacy`, both deprecated in websockets >= 14. These are the two that
  # hang the suite when raised. Gone when uvicorn moves to the new websockets API, which is
  # a dependency bump rather than a change here.
  "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
  "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

# Optional live boundaries require explicit environment opt-ins and delivery execution.
# Ordinary pytest defaults to -m 'not integration'; use -m integration for boundary
# checks or -m '' for the combined population. --certify adds Dagger evidence services.
markers = [
  "integration: real publication, interruption, ownership, application wiring or repository boundary",
  "evidence_unit: retained delivery evidence category",
  "evidence_contract: retained delivery evidence category",
  "evidence_integration: retained delivery evidence category",
  "evidence_fitness: retained delivery evidence category",
  "evidence_provider: retained delivery evidence category",
  "evidence_stress: retained delivery evidence category",
  "evidence_migration: retained delivery evidence category",
  # Orthogonal to the evidence-category markers: this inherited selector names one reviewed
  # architecture surface. It is explicit here so strict collection never depends on another
  # plugin incidentally registering the same word.
  "fitness: inherited S1-S4 architecture selector; evidence category remains manifest-owned",

]
