[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-remember-mcp"
version = "3.1.1"
description = "Model Context Protocol server for Agents Remember."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
# The supported minor line and platforms live here so consumers do not need to clone the
# repository to discover them. Pyrefly targets Python 3.14. GitHub workflows and Dagger
# use uv-managed Python 3.14. Ruff syntax rewrites stay at 3.13. Windows is
# supported through WSL, which presents as Linux and therefore has no separate classifier.
classifiers = [
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  # The SQLite binding of the derived knowledge index, the only knowledge dataset this package
  # creates (knowledge itself is text in Git, and a merge is a structural merge of those files).
  # The release is pinned exactly because the index's schema relies on build-time SQLite
  # features (STRICT tables, deferrable foreign keys, RAISE(ABORT) triggers, recursive CTEs)
  # that have to be proven on each platform the package claims, rather than assumed from the
  # upstream project.
  "apsw==3.53.4.0",
  "mcp>=2.3.0,<3",
  "pydantic>=2,<3",
  "tiktoken>=0.12,<1",
  "packaging>=24,<27",
  "fastapi>=0.135.1,<1",
  "uvicorn>=0.30,<1",
  "watchfiles>=1.1,<2",
  "websockets>=12,<16",
  # Core tree-sitter runtime only: language grammars are never privileged in base
  # dependencies. Every grammar resolves uniformly from the bundled hash-pinned catalog
  # lock (`package_data/citations/language_catalog.lock.json`) into the isolated
  # `AR_LANGUAGE_CACHE` directory without mutating this environment.
  "tree-sitter>=0.26,<0.27",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "coverage>=7.14,<8",
  "dagger-io==0.21.8",
  "httpx>=0.27,<1",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-reportlog>=1,<2",
  "pytest-xdist>=3,<4",
  "pyrefly>=1.5.0,<2",
  "radon>=6,<7",
  "ruff==0.16.1",
]

[project.scripts]
agents-remember = "agents_remember.cli.__main__:main"
agents-remember-mcp = "agents_remember.mcp.__main__:main"

# The project links an index shows beside the package. They are a table of their own because
# the package's page on PyPI reads this table and nothing else; a link that lives only in the
# description renders as prose in the body, not as a project link in the side column.
[project.urls]
Homepage = "https://github.com/Foxfire1st/agents-remember"
Documentation = "https://foxfire1st.github.io/agents-remember/"
Repository = "https://github.com/Foxfire1st/agents-remember"
Issues = "https://github.com/Foxfire1st/agents-remember/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursive (setuptools globs package-data with recursive=True), so whatever is present
# under package_data at build time ships. That includes the cockpit bundle at
# package_data/dashboard/, which is NOT in version control: the release job runs the
# frontend build and the sync before packaging, and the wheel and sdist carry the result.
# Build from a checkout with no bundle and packaging still succeeds -- the glob simply
# matches nothing and the server reports the absence (serving/static.py).
# Dotfiles need an explicit entry; `**/*` does not match them.
agents_remember = [
  "package_data/**/*",
  "package_data/benchmarks/.gitignore",
  # The presenter capability text ships beside its module as well as in the capsule contract's
  # generated package-data copy: canvas/presenter_inputs.py resolves it module-relatively, and an
  # installed build has no checkout to fall back on. The two are byte-identical, and
  # mcp/tests/test_canvas_capsule_text.py fails on drift.
  "canvas/*.md",
  "canvas/*.mjs",
  "cli/*.mjs",
]
