[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-remember-mcp"
version = "3.0.0rc6"
description = "Model Context Protocol server for Agents Remember."
readme = "README.md"
requires-python = ">=3.11"
# The supported floor and the supported platforms, in the one place a consumer can read
# them without cloning. `[tool.ruff] target-version` in the repository-root pyproject is
# pinned to the same floor, and .github/workflows/quality-checks.yml runs the gate on all
# three interpreters listed here. Windows is supported through WSL, which presents as
# Linux to the interpreter and therefore has no separate classifier.
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "mcp>=1.12.4,<2",
  "pydantic>=2,<3",
  "tiktoken>=0.12,<1",
  "packaging>=24,<27",
  "fastapi>=0.135.1,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "watchfiles>=1.1,<2",
  "websockets>=12,<16",
  # The citation check's parser, and the grammars for the languages this tree cites into.
  # Libraries, not a service: no container, no daemon, no external binary, and nothing on
  # the parse path touches the network, so the closeout gate still runs offline.
  #
  # Individual grammar packages rather than a bundled pack, so each carries its own pin.
  # The upper bounds are tight because the NODE TYPE NAMES are the API here --
  # `decorated_definition`, `export_statement`, `variable_declarator` -- and a grammar
  # minor can rename one, which would silently turn a definition into a mention and hand
  # `--fix` a wrong answer rather than an error. The versions every claim in
  # `memory_quality/style/citations/grammars.py` was measured against are listed in that
  # module's `MEASURED_VERSIONS`, and a test fails when these pins stop admitting them.
  #
  # Wheel coverage checked on PyPI 2026-08-02 rather than assumed, against the three
  # interpreters and two platforms this project claims below: tree-sitter ships cp310-cp314
  # wheels for manylinux/musllinux x86_64 and aarch64 and for macOS x86_64 and arm64; the
  # three grammars ship abi3 wheels (cp310-abi3, cp39-abi3 for typescript) covering the
  # same set. No source build and no compiler is needed on any supported target.
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.14,<8",
  "httpx>=0.27,<1",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-xdist>=3,<4",
  "pyright>=1.1,<2",
  "radon>=6,<7",
  "ruff==0.16.1",
]

[project.scripts]
agents-remember = "agents_remember.cli.__main__:main"
agents-remember-mcp = "agents_remember.mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursive (setuptools globs package-data with recursive=True), so whatever is present
# under package_data at build time ships. That includes the cockpit bundle at
# package_data/dashboard/, which is NOT in version control: the release job runs the
# frontend build and the sync before packaging, and the wheel and sdist carry the result.
# Build from a checkout with no bundle and packaging still succeeds -- the glob simply
# matches nothing and the server reports the absence (serving/static.py).
# Dotfiles need an explicit entry; `**/*` does not match them.
agents_remember = [
  "package_data/**/*",
  "package_data/benchmarks/.gitignore",
]
