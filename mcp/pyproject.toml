[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-remember-mcp"
version = "3.0.0rc6"
description = "Model Context Protocol server for Agents Remember."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.4,<2",
  "pydantic>=2,<3",
  "tiktoken>=0.12,<1",
  "fastapi>=0.135.1,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "watchfiles>=1.1,<2",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.14,<8",
  "httpx>=0.27,<1",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pyright>=1.1,<2",
  "radon>=6,<7",
  "ruff>=0.15,<1",
]

[project.scripts]
agents-remember = "agents_remember.cli.__main__:main"
agents-remember-mcp = "agents_remember.mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursive (setuptools globs package-data with recursive=True), so whatever is present
# under package_data at build time ships. That includes the cockpit bundle at
# package_data/dashboard/, which is NOT in version control: the release job runs the
# frontend build and the sync before packaging, and the wheel and sdist carry the result.
# Build from a checkout with no bundle and packaging still succeeds -- the glob simply
# matches nothing and the server reports the absence (serving/static.py).
# Dotfiles need an explicit entry; `**/*` does not match them.
agents_remember = [
  "package_data/**/*",
  "package_data/benchmarks/.gitignore",
]
