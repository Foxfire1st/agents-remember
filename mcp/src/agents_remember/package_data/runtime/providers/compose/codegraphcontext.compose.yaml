services:
  falkordb:
    restart: unless-stopped
    # L12 memory cap: the shared graph DB legitimately holds ~830MiB of loaded graphs
    # today; 2g is headroom, not a target. An OOM kill restarts it (unless-stopped) and
    # the appendonly persistence under the data volume survives the recycle.
    mem_limit: 2g
    environment:
      REDIS_ARGS: "--appendonly yes"
      # The falkordb image defaults to "MAX_QUEUED_QUERIES 25", which is far too small once
      # several cgc watchers (one per repo) plus a reindex run share this single FalkorDB:
      # each cgc indexer self-throttles to ~10 in-flight queries (asyncio.Semaphore(10) in
      # codegraphcontext, writes batched via UNWIND), so total demand is bounded by
      # (#concurrent indexers) x 10 -- independent of repo size. A bounded 1024-deep queue
      # therefore absorbs ~100 concurrent indexers without ever rejecting ("Max pending
      # queries exceeded") and without unbounded memory. TIMEOUT/RESULTSET_SIZE keep the
      # image defaults (this env replaces FALKORDB_ARGS wholesale).
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 1024 TIMEOUT 1000 RESULTSET_SIZE 10000"
    healthcheck:
      # redis-cli exits 0 even on a LOADING error reply, so a bare ping marks
      # the service healthy while the dataset is still loading; require PONG.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  runner:
    profiles: ["run"]
    entrypoint: ["cgc"]
    # L12 memory cap: batch index/query jobs get more headroom than the long-lived
    # watchers (a full reindex parses far more at once), but still a hard ceiling so a
    # runaway job degrades itself instead of the host.
    mem_limit: 1g
    depends_on:
      falkordb:
        condition: service_healthy
