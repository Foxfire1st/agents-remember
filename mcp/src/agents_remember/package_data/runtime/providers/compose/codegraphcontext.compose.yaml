services:
  falkordb:
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  runner:
    profiles: ["run"]
    entrypoint: ["cgc"]
    depends_on:
      falkordb:
        condition: service_healthy
