<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Engine Room · Pod Stage choreography (5f §7 prototype)</title>
<style>
  :root{
    --bg:oklch(0.16 0.02 250); --bgPanel:oklch(0.2 0.02 250); --ink:oklch(0.92 0.03 90);
    --grid:oklch(0.3 0.02 250); --muted:oklch(0.7 0.02 250);
    --amber:oklch(0.82 0.16 75); --cyan:oklch(0.85 0.13 200);
    --alarm:oklch(0.63 0.24 25); --mint:oklch(0.88 0.16 165); --dormant:oklch(0.45 0.06 25);
    --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono)}
  body{display:flex;flex-direction:column;gap:.4rem;padding:.7rem 1rem 1rem}
  header{display:flex;align-items:baseline;gap:1rem}
  h1{font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:0}
  .sub{font-size:.72rem;color:var(--muted)}
  .stage{position:relative;flex:1;min-height:0;border:1px solid var(--grid);border-radius:4px;
    background:radial-gradient(120% 90% at 50% 42%, oklch(0.2 0.03 250) 0%, var(--bg) 72%);overflow:hidden}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;z-index:3;
    background:repeating-linear-gradient(to bottom,transparent 0 2px,#000 2px 3px)}
  /* faint blueprint-video backdrop — single pre-rendered boomerang (forward then reversed, crossfaded seam); loops seamlessly; tinted blue→amber */
  .backdrop{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .backdrop video{width:100%;height:100%;object-fit:cover;opacity:.14;
    filter:grayscale(1) sepia(1) saturate(2.6) hue-rotate(6deg) brightness(.85) contrast(1.05);
    mix-blend-mode:screen}
  svg{width:100%;height:100%;display:block;position:relative;z-index:2}
  .worldLabel{font-size:14px;fill:var(--muted);letter-spacing:.16em;text-transform:uppercase}

  /* every change eases; .seeking disables transitions for instant scrub/reset */
  #scene g,#scene line,#scene rect,#scene path,#scene circle,#scene text{
    transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .5s ease,stroke .45s ease,
      fill .45s ease,stroke-dashoffset .7s cubic-bezier(.4,0,.2,1);}
  #scene.seeking *{transition:none !important}

  /* branch nodes */
  .node .box{fill:oklch(0.22 0.03 250);stroke:var(--amber);stroke-width:1.5}
  .node .t1{fill:var(--ink);font-size:15px;font-weight:600}
  .node .t2{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .node.derived .box{stroke:var(--cyan);stroke-dasharray:5 4}
  .node.fresh .box{stroke:var(--mint);filter:drop-shadow(0 0 4px var(--mint))}
  .node.fresh .t2{fill:var(--mint)}
  .node.pruned .box{stroke:var(--dormant);fill:oklch(0.18 0.02 25)}
  .node.pruned .t1,.node.pruned .t2{fill:var(--dormant)}

  /* structural connectors: smooth diagonal provider->branch, gentle cross-gap, thick coupler */
  .wire{stroke:var(--amber);stroke-width:2;opacity:.8;fill:none;stroke-linecap:round}
  .coupler-g{opacity:0}
  .coupler-g.bound{opacity:1}
  .coupler{stroke:var(--amber);stroke-width:9;opacity:.95;stroke-linecap:round;filter:drop-shadow(0 0 2px var(--amber))}
  .cpl-bind{transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
  #scene .coupler-g.bound .cpl-bind{transform:scaleY(1);transition:transform .5s cubic-bezier(.3,1,.4,1)}
  .cpl-rung{stroke:var(--amber);stroke-width:1.5;opacity:.8;stroke-linecap:round}
  .cpl-node{fill:oklch(0.3 0.09 82);stroke:var(--amber);stroke-width:1.2}
  /* warp-core surge: a hot band born at the node, splitting up + down, repeating */
  .cpl-surge{stroke:oklch(0.95 0.1 90);stroke-width:7;stroke-linecap:round;opacity:0;filter:drop-shadow(0 0 5px var(--amber))}
  #scene .coupler-g.bound .cpl-surge.up{animation:warpup 1.6s cubic-bezier(.4,0,.5,1) infinite}
  #scene .coupler-g.bound .cpl-surge.down{animation:warpdown 1.6s cubic-bezier(.4,0,.5,1) infinite}
  @keyframes warpup{0%{opacity:0;transform:translateY(0)}18%{opacity:.95}100%{opacity:0;transform:translateY(-24px)}}
  @keyframes warpdown{0%{opacity:0;transform:translateY(0)}18%{opacity:.95}100%{opacity:0;transform:translateY(24px)}}
  .enc{fill:none;stroke:var(--amber);stroke-width:1.8;opacity:.5;stroke-dasharray:9 7;stroke-linecap:round}

  /* remote dock */
  .rnode .rbox{fill:oklch(0.21 0.03 250);stroke:var(--cyan);stroke-width:1.4}
  .rnode .rt{fill:var(--cyan);font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .rlabel{fill:var(--muted);font-size:11px;letter-spacing:.14em}

  /* engine columns — podracer wireframe gauge: slim cells, charge climbs bottom-up, petal flanks */
  .prov .e-out{fill:oklch(0.18 0.02 250);stroke:var(--amber);stroke-width:1.5;opacity:.9}
  .prov .e-charge{fill:var(--cyan);transform-box:fill-box;transform-origin:center;transform:scaleY(0);opacity:0}
  #scene .prov .e-charge{transition:transform 1s cubic-bezier(.22,1,.36,1),fill .4s ease,opacity .4s ease}
  .prov .e-div{stroke:oklch(0.16 0.02 250);stroke-width:2;opacity:.85}
  .prov .e-spine{stroke:var(--amber);stroke-width:.8;opacity:.28}
  .prov .e-petal{stroke:var(--amber);stroke-width:1.4;opacity:0;stroke-linecap:round}
  .prov .e-lbl{fill:var(--ink);font-size:12px;letter-spacing:.1em;font-weight:600}
  .prov.dim .e-out{stroke:var(--dormant);opacity:.5} .prov.dim .e-lbl{fill:var(--muted)} .prov.dim .e-petal{opacity:0}
  .prov.booting .e-charge{transform:scaleY(1);opacity:.85;fill:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))} .prov.booting .e-petal{opacity:.5}
  .prov.green .e-charge{transform:scaleY(1);opacity:1;animation:powerup 1.15s ease forwards;filter:drop-shadow(0 0 5px var(--mint))} .prov.green .e-out{stroke:var(--mint);filter:drop-shadow(0 0 4px var(--mint))} .prov.green .e-petal{opacity:.7;stroke:var(--mint)}
  .prov.nominal .e-out{stroke:var(--amber);opacity:1} .prov.nominal .e-charge{transform:scaleY(1);opacity:.16;fill:var(--amber)} .prov.nominal .e-petal{opacity:.55}
  .prov.off .e-out{stroke:var(--dormant);opacity:.4} .prov.off .e-charge{opacity:0;transform:scaleY(0)} .prov.off .e-lbl{fill:var(--dormant)} .prov.off .e-petal{opacity:0}
  .prov.fault .e-out{stroke:var(--alarm);animation:flick .34s steps(1) infinite;filter:drop-shadow(0 0 4px var(--alarm))} .prov.fault .e-charge{fill:var(--alarm);opacity:.5;transform:scaleY(1)} .prov.fault .e-petal{opacity:.6;stroke:var(--alarm)}
  @keyframes powerup{0%{fill:var(--cyan)}35%{fill:var(--mint);opacity:1}100%{fill:var(--amber);opacity:.18}}
  @keyframes flick{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
  /* reindex (T9c) — yellow-ish content pulse: a band born at centre, spreading to top + bottom, looping */
  .prov.reindex .e-out{stroke:var(--amber);opacity:1} .prov.reindex .e-petal{opacity:.5;stroke:var(--amber)} .prov.reindex .e-lbl{fill:var(--amber)}
  .prov.reindex .e-charge{fill:var(--amber);opacity:1;filter:drop-shadow(0 0 5px var(--amber));animation:reindex 1.5s ease-out infinite}
  @keyframes reindex{0%{transform:scaleY(.04);opacity:.95}65%{transform:scaleY(1);opacity:.5}100%{transform:scaleY(1);opacity:0}}

  /* flow conduits — draw IN (source→target), despawn OUT (retract source→tip); travelling packet */
  .flowpath{fill:none;stroke:var(--cyan);stroke-width:2.4;opacity:0;marker-end:url(#chev);
    stroke-dasharray:100 100;stroke-dashoffset:100;filter:drop-shadow(0 0 3px var(--cyan))}
  #scene .flow-g.on .flowpath{opacity:.9;stroke-dashoffset:0;
    transition:stroke-dashoffset .55s cubic-bezier(.25,1,.4,1),opacity .2s ease}
  #scene .flow-g.off .flowpath{opacity:0;stroke-dashoffset:-100;
    transition:stroke-dashoffset .5s cubic-bezier(.5,0,.7,1),opacity .25s ease .32s}
  .flow-g.on .pkt{opacity:1;animation:run 1.4s linear infinite}
  .pkt{fill:var(--cyan);opacity:0;filter:drop-shadow(0 0 5px var(--cyan))}
  @keyframes run{0%{offset-distance:0%}100%{offset-distance:100%}}
  /* refused seed conduit — blue → flash → recolour → disappear. amber = reroute (T9c); red = fault (T9b) */
  #scene .flow-g.refused .flowpath{opacity:.9;stroke-dashoffset:0;stroke:var(--amber);
    filter:drop-shadow(0 0 4px var(--amber));animation:refused .9s ease forwards}
  @keyframes refused{0%{stroke:var(--cyan);opacity:.9}12%{stroke:oklch(0.98 0.04 200);opacity:1}26%{stroke:var(--amber);opacity:1}70%{stroke:var(--amber);opacity:1}100%{stroke:var(--amber);opacity:0}}
  #scene .flow-g.refused.refred .flowpath{stroke:var(--alarm);filter:drop-shadow(0 0 4px var(--alarm));animation:refusedred .9s ease forwards}
  @keyframes refusedred{0%{stroke:var(--cyan);opacity:.9}12%{stroke:oklch(0.98 0.04 200);opacity:1}26%{stroke:var(--alarm);opacity:1}70%{stroke:var(--alarm);opacity:1}100%{stroke:var(--alarm);opacity:0}}

  .flag{opacity:0} .flag.show{opacity:1}
  .pulse{animation:pulse 1s ease 2}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ===== failure-mode primitives (§6 non-happy paths) ===== */
  /* blocked = STEADY red gate (no flicker); fault = flicker (.prov.fault). They must read differently. */
  .gate{opacity:0} .gate.show{opacity:1}
  .gate .gbar{fill:var(--alarm);opacity:.92;filter:drop-shadow(0 0 7px var(--alarm))}
  .gate .gmsg{fill:oklch(0.2 0.05 25);stroke:var(--alarm);stroke-width:1.1}
  .gate .gdot{fill:var(--cyan);filter:drop-shadow(0 0 3px var(--cyan))}
  .gate .gtxt{fill:oklch(0.96 0.05 25);font-size:11px;letter-spacing:.03em;font-weight:600}
  #scene .gate .gbar{transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.5,0,.7,1)}
  .gate:not(.show) .gbar{transform:scaleY(0)}
  /* fleeting / ghost enclosure — provisional, planned/ghost register */
  .fleeting{opacity:0} .fleeting.show{opacity:1}
  .fleeting .fbox{fill:oklch(0.19 0.04 25);stroke:var(--alarm);stroke-width:1.6;stroke-dasharray:8 7;opacity:.55}
  .fleeting .ftitle{fill:oklch(0.78 0.16 25);font-size:13px;letter-spacing:.06em;font-weight:600}
  .fleeting .fsub{fill:var(--muted);font-size:10.5px;letter-spacing:.02em}
  .ghost{opacity:.3 !important;filter:grayscale(.45)}
  /* recovery choice chips */
  .chip{opacity:0} .chip.show{opacity:1}
  .chip rect{fill:oklch(0.22 0.04 250);stroke:var(--amber);stroke-width:1.1}
  .chip text{fill:var(--amber);font-size:10.5px;letter-spacing:.02em}
  /* generic indicator message badge (fault reason / reroute note) — same language as the gate badge */
  .imsg{opacity:0} .imsg.show{opacity:1}
  .imsg .im-bg{fill:oklch(0.2 0.05 25);stroke:var(--alarm);stroke-width:1.1}
  .imsg.soft .im-bg{fill:oklch(0.18 0.04 230);stroke:var(--cyan)}
  .imsg .im-dot{fill:var(--cyan);filter:drop-shadow(0 0 3px var(--cyan))}
  .imsg .im-tx{fill:oklch(0.96 0.05 25);font-size:11px;letter-spacing:.03em;font-weight:600}
  .imsg.soft .im-tx{fill:var(--cyan)}
  /* attention badge — alarm parity (gentle breathing, NOT the fault flicker) */
  .attn{opacity:0} .attn.show{opacity:1;animation:attn 1.3s ease-in-out infinite}
  .attn rect{fill:oklch(0.26 0.09 25);stroke:var(--alarm);stroke-width:1.3;filter:drop-shadow(0 0 4px var(--alarm))}
  .attn text{fill:oklch(0.93 0.08 25);font-size:11px;letter-spacing:.12em;font-weight:600}
  @keyframes attn{0%,100%{opacity:.78}50%{opacity:1}}
  /* scan ring (preflight sweep) + dissolve (abandon) */
  .scan{stroke:var(--cyan);stroke-width:2;fill:none;opacity:0}
  .scan.on{animation:scan 1s ease-out infinite}
  @keyframes scan{0%{opacity:.8;r:6}100%{opacity:0;r:60}}
  .dissolve{transform-box:fill-box;transform-origin:center;animation:dissolve .6s ease forwards}
  @keyframes dissolve{to{opacity:0;transform:scale(.94)}}

  .bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
  button,.seg{font-family:var(--mono);font-size:.74rem;color:var(--ink);background:var(--bgPanel);
    border:1px solid var(--grid);border-radius:3px;padding:.28rem .55rem;cursor:pointer}
  button:hover{border-color:var(--amber)} .seg.on{border-color:var(--cyan);color:var(--cyan)}
  input[type=range]{flex:1;accent-color:var(--amber)}
  .cap{font-size:.82rem;color:var(--amber);min-height:1.2em} .cap b{color:var(--mint)}
  .who{margin-left:auto;font-size:.7rem;color:var(--muted)}
</style>
</head>
<body>
  <header>
    <h1>Engine Room · Pod Stage</h1>
    <span class="sub">5f §7 choreography — two-world canvas (Image #8 topology) · build-up + tear-down</span>
  </header>

  <div class="stage">
    <div class="backdrop" aria-hidden="true"><video src="blueprint-boomerang.mp4" autoplay loop muted playsinline></video></div>
    <svg id="scene" viewBox="0 0 1200 660" preserveAspectRatio="xMidYMid meet">
      <defs>
        <path id="p-clone-cgc"  d="M135 102 C 440 26 820 50 1048 94" pathLength="100"/>
        <path id="p-clone-grep" d="M135 548 C 440 622 820 600 1048 556" pathLength="100"/>
        <path id="p-int-code"   d="M700 281 L 648 281" pathLength="100"/>
        <path id="p-int-mem"    d="M700 403 L 648 403" pathLength="100"/>
        <path id="p-replay-code" d="M700 281 L 482 281" pathLength="100"/>
        <path id="p-replay-mem"  d="M700 403 L 482 403" pathLength="100"/>
        <path id="p-push-code"  d="M580 250 L 586 100" pathLength="100"/>
        <path id="p-pull-code"  d="M418 100 L 432 250" pathLength="100"/>
        <path id="p-carry-mem"  d="M512 403 L 480 403" pathLength="100"/>
        <path id="p-push-mem"   d="M390 434 L 418 524" pathLength="100"/>
        <marker id="chev" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
          <path d="M1.5 1 L8.5 5 L1.5 9" fill="none" stroke="context-stroke" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ===== canopy housing (HUD frame: bevel rim + corner brackets + edge ticks) ===== -->
      <g class="canopy" aria-hidden="true">
        <rect x="14" y="14" width="1172" height="632" rx="22" fill="none" stroke="var(--amber)" stroke-width="1.5" opacity=".22"/>
        <rect x="24" y="24" width="1152" height="612" rx="15" fill="none" stroke="var(--amber)" stroke-width="1" opacity=".1"/>
        <path d="M58 22 L22 22 L22 58" fill="none" stroke="var(--amber)" stroke-width="2" opacity=".5"/>
        <path d="M1142 22 L1178 22 L1178 58" fill="none" stroke="var(--amber)" stroke-width="2" opacity=".5"/>
        <path d="M58 638 L22 638 L22 602" fill="none" stroke="var(--amber)" stroke-width="2" opacity=".5"/>
        <path d="M1142 638 L1178 638 L1178 602" fill="none" stroke="var(--amber)" stroke-width="2" opacity=".5"/>
        <g stroke="var(--amber)" stroke-width="1.2" opacity=".3">
          <line x1="300" y1="14" x2="300" y2="24"/><line x1="600" y1="14" x2="600" y2="24"/><line x1="900" y1="14" x2="900" y2="24"/>
          <line x1="300" y1="646" x2="300" y2="636"/><line x1="600" y1="646" x2="600" y2="636"/><line x1="900" y1="646" x2="900" y2="636"/>
          <line x1="14" y1="220" x2="24" y2="220"/><line x1="14" y1="440" x2="24" y2="440"/>
          <line x1="1186" y1="220" x2="1176" y2="220"/><line x1="1186" y1="440" x2="1176" y2="440"/>
        </g>
      </g>

      <text class="worldLabel" x="55" y="40">Official line · workspace</text>
      <text class="worldLabel" x="930" y="40">Worktree enclosure</text>

      <!-- enclosure border -->
      <rect id="enc-border" class="enc" x="674" y="76" width="474" height="506" rx="18"/>

      <!-- ===== LEFT WORLD wiring (provider column → branch) ===== -->
      <line class="wire" id="w-m-cgc"  x1="135" y1="185" x2="300" y2="252"/>
      <line class="wire" id="w-m-grep" x1="135" y1="466" x2="300" y2="432"/>
      <g id="cpl-main" class="coupler-g bound">
        <g class="cpl-bind">
          <line class="coupler" x1="390" y1="312" x2="390" y2="372"/>
          <line class="cpl-rung" x1="381" y1="323" x2="399" y2="323"/><line class="cpl-rung" x1="381" y1="361" x2="399" y2="361"/>
          <line class="cpl-surge up" x1="390" y1="335" x2="390" y2="349"/><line class="cpl-surge down" x1="390" y1="335" x2="390" y2="349"/>
        </g>
        <rect class="cpl-node" x="383" y="335" width="14" height="14" rx="3"/>
      </g>

      <!-- ===== CROSS-GAP derived links (straight) ===== -->
      <line class="wire" id="link-code" x1="480" y1="281" x2="700" y2="281" opacity="0"/>
      <line class="wire" id="link-mem"  x1="480" y1="403" x2="700" y2="403" opacity="0"/>

      <!-- ===== RIGHT WORLD wiring (straight, per Image #8) ===== -->
      <line class="wire" id="w-w-cgc"  x1="900" y1="252" x2="1057" y2="185" opacity="0"/>
      <line class="wire" id="w-w-grep" x1="900" y1="432" x2="1057" y2="466" opacity="0"/>
      <g id="cpl-wt" class="coupler-g">
        <g class="cpl-bind">
          <line class="coupler" x1="800" y1="312" x2="800" y2="372"/>
          <line class="cpl-rung" x1="791" y1="323" x2="809" y2="323"/><line class="cpl-rung" x1="791" y1="361" x2="809" y2="361"/>
          <line class="cpl-surge up" x1="800" y1="335" x2="800" y2="349"/><line class="cpl-surge down" x1="800" y1="335" x2="800" y2="349"/>
        </g>
        <rect class="cpl-node" x="793" y="335" width="14" height="14" rx="3"/>
      </g>

      <!-- ===== flow conduits ===== -->
      <g class="flow-g clone" id="flow-clone-cgc"><use href="#p-clone-cgc" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M135 102 C 440 26 820 50 1048 94')"/></g>
      <g class="flow-g clone" id="flow-clone-grep"><use href="#p-clone-grep" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M135 548 C 440 622 820 600 1048 556')"/></g>
      <g class="flow-g" id="flow-int-code"><use href="#p-int-code" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M700 281 L 648 281')"/></g>
      <g class="flow-g" id="flow-int-mem"><use href="#p-int-mem" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M700 403 L 648 403')"/></g>
      <g class="flow-g" id="flow-replay"><use href="#p-replay-code" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M700 281 L 482 281')"/></g>
      <g class="flow-g" id="flow-replay-mem"><use href="#p-replay-mem" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M700 403 L 482 403')"/></g>
      <g class="flow-g" id="flow-push"><use href="#p-push-code" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M580 250 L 586 100')"/></g>
      <g class="flow-g" id="flow-pull"><use href="#p-pull-code" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M418 100 L 432 250')"/></g>
      <g class="flow-g" id="flow-carry"><use href="#p-carry-mem" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M512 403 L 480 403')"/></g>
      <g class="flow-g" id="flow-pushmem"><use href="#p-push-mem" class="flowpath"/>
        <circle class="pkt" r="4.5" style="offset-path:path('M390 434 L 418 524')"/></g>

      <!-- ===== REMOTE · code remotes side-by-side (top, flow right→left); memory remote mirrored to bottom ===== -->
      <g class="flag rlabel-g" id="r-label"><text class="rlabel" x="502" y="50" text-anchor="middle">REMOTE · ORIGIN</text></g>
      <g class="flag rnode" id="r-main"><rect class="rbox" x="344" y="66" width="148" height="34" rx="6"/>
        <text class="rt" x="418" y="88" text-anchor="middle">origin/main</text></g>
      <g class="flag" id="pr"><path d="M512 83 L492 83" stroke="var(--mint)" stroke-width="2.5"/>
        <path d="M499 78 L492 83 L499 88 Z" fill="var(--mint)"/>
        <text x="502" y="118" fill="var(--mint)" font-size="11" text-anchor="middle">PR ▸ merge</text></g>
      <g class="flag rnode" id="r-branch"><rect class="rbox" x="512" y="66" width="148" height="34" rx="6"/>
        <text class="rt" x="586" y="88" text-anchor="middle">origin/feat-branch</text></g>
      <g class="flag rnode" id="r-memmain"><rect class="rbox" x="344" y="524" width="148" height="34" rx="6"/>
        <text class="rt" x="418" y="546" text-anchor="middle">origin/mem-main</text></g>

      <!-- ===== LEFT engine columns ===== -->

<script>
const S=document.getElementById('scene'), E=id=>document.getElementById(id);
const set=(id,s)=>{const el=E(id); if(el) Object.assign(el.style,s);};
const prov=(id,st)=>{const el=E(id); if(!el)return;
  el.classList.remove('dim','booting','green','nominal','off','fault','reindex'); el.classList.add(st);
  el.style.opacity = st==='off' ? '.55' : '1';};
const flag=(id,on)=>{const el=E(id); if(el) el.classList.toggle('show',!!on);};
// flow on = draw in (source→target); flow off while playing = despawn (retract source→tip); while
// seeking / already-hidden = snap hidden. The .off class drives the reverse stroke-dashoffset.
const flow=(id,on)=>{const el=E(id); if(!el)return;
  if(on){ el.classList.remove('off','refused','refred'); el.classList.add('on'); return; }
  el.classList.remove('refused','refred'); const wasOn=el.classList.contains('on'); el.classList.remove('on');
  if(S.classList.contains('seeking')||!wasOn) el.classList.remove('off'); else el.classList.add('off');};
// seed conduit refused: flash → recolour → disappear. red=true → red (fault); else amber (reroute). instant-hidden while seeking
const refuse=(id,red)=>{const el=E(id); if(!el)return;
  if(S.classList.contains('seeking')){ el.classList.remove('on','off','refused','refred'); return; }
  el.classList.remove('on','off'); el.classList.add('refused'); el.classList.toggle('refred',!!red);};
const cls=(id,add,name)=>{const el=E(id); if(el) el.classList.toggle(name,!!add);};
const REMOTE=['r-label','r-branch','r-main','r-memmain','pr'];
const FLOWS=['flow-clone-cgc','flow-clone-grep','flow-int-code','flow-int-mem','flow-replay','flow-replay-mem','flow-push','flow-pull','flow-carry','flow-pushmem'];
// staggered intra-beat reveals: schedule during play (ordered), fire instantly while seeking, cancel on beat change
let stagTimers=[];
const clearStag=()=>{ stagTimers.forEach(clearTimeout); stagTimers=[]; };
const seq=(steps)=>{ if(S.classList.contains('seeking')) steps.forEach(s=>s[1]());
  else steps.forEach(s=>stagTimers.push(setTimeout(s[1],s[0]))); };

// ===== failure-mode primitive helpers =====
// gate(show, x,y,w of the dropped bar, reason = local message, dir = +1 badge below / -1 above)
const gate=(show,x,y,w,reason,dir)=>{const g=E('gate'); if(!g)return; g.classList.toggle('show',!!show);
  const has=!!(show&&reason); ['gmsg','gdot','gtxt'].forEach(id=>{const e=E(id); if(e) e.style.display=has?'':'none';});
  if(!show) return;
  const b=E('gbar'); b.setAttribute('x',x); b.setAttribute('y',y); b.setAttribute('width',w);
  if(!has) return;
  const cx=x+w/2, d=dir||1, mw=Math.max(w,reason.length*6.4+40), px=cx-mw/2, my=d>0?y+16:y-28;
  const m=E('gmsg'); m.setAttribute('x',px); m.setAttribute('y',my); m.setAttribute('width',mw);
  const dot=E('gdot'); dot.setAttribute('cx',px+15); dot.setAttribute('cy',my+11);
  const t=E('gtxt'); t.setAttribute('x',px+28); t.setAttribute('y',my+15); t.textContent=reason;};
const fleeting=(show,title,sub)=>{const f=E('fleeting'); if(!f)return; f.classList.toggle('show',!!show);
  if(title) E('ftitle').textContent=title; if(sub!=null) E('fsub').textContent=sub;};
const attn=(show)=>{const a=E('attn'); if(a) a.classList.toggle('show',!!show);};
const ghost=(id,on)=>{const el=E(id); if(el) el.classList.toggle('ghost',!!on);};
const scan=(on,cx,cy)=>{const s=E('scan'); if(!s)return; if(cx!=null){s.setAttribute('cx',cx);s.setAttribute('cy',cy);} s.classList.toggle('on',!!on);};
const chips=(labels)=>{ ['chip1','chip2','chip3'].forEach((id,i)=>{const c=E(id); if(!c)return;
  const on=i<labels.length; c.classList.toggle('show',on); if(on) c.querySelector('text').textContent=labels[i]; });};
// generic indicator message badge centred at (cx,cy); soft=true → cyan (a fallback, not a fault)
const imsg=(show,cx,cy,text,soft)=>{const g=E('imsg'); if(!g)return; g.classList.toggle('show',!!show); g.classList.toggle('soft',!!soft);
  if(!show) return;
  const mw=Math.max(60,(text?text.length:0)*6.4+40), px=cx-mw/2;
  E('im-bg').setAttribute('x',px); E('im-bg').setAttribute('y',cy-11); E('im-bg').setAttribute('width',mw);
  E('im-dot').setAttribute('cx',px+15); E('im-dot').setAttribute('cy',cy);
  E('im-tx').setAttribute('x',px+28); E('im-tx').setAttribute('y',cy+4); E('im-tx').textContent=text||'';};
const clearFail=()=>{ gate(false); fleeting(false); attn(false); scan(false); chips([]); imsg(false);
  ['m-code','m-mem','w-code','w-mem','link-mem','w-w-grep','w-grep','feat-code','feat-mem'].forEach(i=>ghost(i,false));
  ['enc-border','w-code','w-mem'].forEach(i=>cls(i,false,'dissolve'));
  const h=E('hist'); if(h){ const t=h.querySelector('text'); if(t) t.textContent='contract · historical'; } };

// ===== shared build steps (happy build + failure-recovery tails reuse these) =====
const STEP={
  reset(){
    set('enc-border',{opacity:'0'});
    ['link-code','link-mem','w-w-cgc','w-w-grep'].forEach(i=>set(i,{opacity:'0'})); cls('cpl-wt',false,'bound');
    set('w-code',{opacity:'0',transform:'translate(-400px,0)'}); set('w-mem',{opacity:'0',transform:'translate(-400px,0)'});
    set('w-cgc',{opacity:'0'}); set('w-grep',{opacity:'0'}); prov('w-cgc','dim'); prov('w-grep','dim');
    FLOWS.forEach(i=>flow(i,false));
    prov('m-cgc','nominal'); prov('m-grep','nominal');
    [...REMOTE,'feat-code','feat-mem','commit-code','commit-mem','contract','ledger','hist'].forEach(f=>flag(f,false));
    cls('w-code',true,'derived'); cls('w-mem',true,'derived');
    cls('m-code',false,'fresh'); cls('m-mem',false,'fresh'); cls('m-code',false,'pruned'); cls('m-mem',false,'pruned');
    E('m-code-h').textContent='main @a1b2c3'; E('m-mem-h').textContent='main @d4e5f6';
    clearFail();
  },
  codeWt(){ set('enc-border',{opacity:'.5'}); set('w-code',{opacity:'1',transform:'translate(0,0)'}); set('link-code',{opacity:'.8'}); },
  memWt(){ set('w-mem',{opacity:'1',transform:'translate(0,0)'}); set('link-mem',{opacity:'.8'}); cls('cpl-wt',true,'bound'); },
  enginesDim(){ set('w-cgc',{opacity:'1'}); set('w-grep',{opacity:'1'}); prov('w-cgc','dim'); prov('w-grep','dim');
    set('w-w-cgc',{opacity:'.8'}); set('w-w-grep',{opacity:'.8'}); flow('flow-clone-cgc',true); flow('flow-clone-grep',true); },
  charge(){ prov('w-cgc','booting'); prov('w-grep','booting'); },
  running(){ flow('flow-clone-cgc',false); flow('flow-clone-grep',false); prov('w-cgc','green'); prov('w-grep','green');
    cls('w-code',false,'derived'); cls('w-mem',false,'derived');
    setTimeout(()=>{ if(E('w-cgc').classList.contains('green')) prov('w-cgc','nominal');
                     if(E('w-grep').classList.contains('green')) prov('w-grep','nominal'); },1150); },
  // running idle constellation (the built/at-rest state) — shared by tear-down D0 + the live/teardown failures
  idle(){
    set('enc-border',{opacity:'.5'});
    ['link-code','link-mem','w-w-cgc','w-w-grep'].forEach(i=>set(i,{opacity:'.8'})); cls('cpl-wt',true,'bound');
    set('w-code',{opacity:'1',transform:'translate(0,0)'}); set('w-mem',{opacity:'1',transform:'translate(0,0)'});
    set('w-cgc',{opacity:'1'}); set('w-grep',{opacity:'1'}); prov('w-cgc','nominal'); prov('w-grep','nominal');
    prov('m-cgc','nominal'); prov('m-grep','nominal');
    cls('w-code',false,'derived'); cls('w-mem',false,'derived'); },
  idleClean(){ STEP.idle();
    cls('w-code',false,'pruned'); cls('w-mem',false,'pruned'); cls('feat-code',false,'pruned'); cls('feat-mem',false,'pruned');
    cls('m-code',false,'fresh'); cls('m-mem',false,'fresh');
    E('m-code-h').textContent='main @a1b2c3'; E('m-mem-h').textContent='main @d4e5f6';
    [...REMOTE,'feat-code','feat-mem','commit-code','commit-mem','contract','ledger','hist'].forEach(f=>flag(f,false));
    FLOWS.forEach(i=>flow(i,false)); clearFail(); },
};

// ===== BUILD-UP B0..B5 =====
const BUILD=[
  {k:'B0',cap:'<b>B0</b> · main only — the official line exists; no enclosure yet.',do(){ STEP.reset(); }},
  {k:'B1',cap:'<b>B1</b> · enclosure shell draws; <b>code worktree copies in</b> from main (branch-copy).',do(){ STEP.codeWt(); }},
  {k:'B2',cap:'<b>B2</b> · memory worktree copies in; the contract <b>coupler binds</b> (Code===Mem).',do(){ STEP.memWt(); }},
  {k:'B3',dur:220,cap:'<b>B3</b> · provider runtime — engines materialise dim, <b>cloned from main</b> (not re-indexed).',do(){ STEP.enginesDim(); }},
  {k:'B4',cap:'<b>B4</b> · seed / clone — engines <b>charge cyan</b> (boot-fill climbing).',do(){ STEP.charge(); }},
  {k:'B5',cap:'<b>B5</b> · powered — <b>went green</b>, settle amber-nominal. Clone arrows gone. Idle constellation (= Image #8).',do(){ STEP.running(); }},
];

// ===== TEAR-DOWN D0..D6 =====
const TEAR=[
  {k:'D0',cap:'<b>D0</b> · idle / working enclosure — the whole constellation, at rest.',do(){
    set('enc-border',{opacity:'.5'});
    ['link-code','link-mem','w-w-cgc','w-w-grep'].forEach(i=>set(i,{opacity:'.8'})); cls('cpl-wt',true,'bound');
    set('w-code',{opacity:'1',transform:'translate(0,0)'}); set('w-mem',{opacity:'1',transform:'translate(0,0)'});
    set('w-cgc',{opacity:'1'}); set('w-grep',{opacity:'1'}); prov('w-cgc','nominal'); prov('w-grep','nominal');
    prov('m-cgc','nominal'); prov('m-grep','nominal');

// ===== controller =====
const SCENARIOS={build:BUILD, tear:TEAR, t1b:T1B, t3b:T3B, t7b:T7B, t9b:T9B, t9c:T9C, t12b:T12B, t14c:T14C, t18:T18};
let seqName='build', SEQ=BUILD, cur=-1, playing=false, timer=null, looping=true;
const cap=E('cap'), who=E('who'), scrub=E('scrub');
function seekTo(t){ clearStag(); S.classList.add('seeking'); SEQ[0].do(); for(let i=1;i<=t;i++) SEQ[i].do();
  cur=t; sync(); void S.getBoundingClientRect(); requestAnimationFrame(()=>S.classList.remove('seeking')); }
function sync(){ const b=SEQ[Math.max(0,cur)]; cap.innerHTML=b?b.cap:''; who.textContent=b?b.k:'—';
  scrub.max=SEQ.length-1; scrub.value=Math.max(0,cur); }
function next(){ if(cur<SEQ.length-1){ clearStag(); S.classList.remove('seeking'); SEQ[cur+1].do(); cur++; sync(); } else if(looping) seekTo(0); }
function prev(){ if(cur>0) seekTo(cur-1); }
function schedule(){ clearTimeout(timer); if(!playing) return;
  timer=setTimeout(()=>{ if(!playing) return;
    if(cur>=SEQ.length-1){ if(looping) seekTo(0); else { pause(); return; } }
    else { clearStag(); S.classList.remove('seeking'); SEQ[cur+1].do(); cur++; sync(); }
    schedule();
  }, (SEQ[Math.max(0,cur)] && SEQ[Math.max(0,cur)].dur) || 1900); }
function play(){ playing=true; E('play').textContent='⏸ pause'; schedule(); }
function pause(){ playing=false; E('play').textContent='⏯ play'; clearTimeout(timer); }
function loadSeq(n){ pause(); seqName=n; SEQ=SCENARIOS[n]||BUILD;
  if(E('scenario')) E('scenario').value=n; seekTo(0); }
E('scenario').onchange=()=>{loadSeq(E('scenario').value);play();};
E('restart').onclick=()=>{pause();seekTo(0);}; E('prev').onclick=()=>{pause();prev();};
E('next').onclick=()=>{pause();next();}; E('play').onclick=()=>playing?pause():play();
E('loop').onclick=()=>{looping=!looping;E('loop').classList.toggle('on',looping);};
scrub.oninput=()=>{pause();seekTo(+scrub.value);};
window.__pod={loadSeq,next,prev,play,pause,seekTo,get state(){return{seqName,cur,beat:SEQ[Math.max(0,cur)]?.k};}};
loadSeq('build'); play();

// ===== blueprint backdrop =====
// The backdrop is a single pre-rendered boomerang: the forward clip (slow zoom-IN) followed by its
// reversed half (zoom-OUT), crossfaded at the seam (ffmpeg xfade). It starts and ends on the same frame,
// so the native loop is frame-continuous — no jump, no JS counter-zoom. Just nudge autoplay if blocked.
(function(){ const v=document.querySelector('.backdrop video'); if(!v) return;
  v.muted=true; const p=v.play&&v.play(); if(p&&p.catch) p.catch(()=>{}); })();
</script>
